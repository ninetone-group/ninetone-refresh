name = "ninetone-fm-image-proxy"
# Pinned to Ninetone's Cloudflare account (Patrik.frisk@ninetone.com) since 2026-09-12; the retired copy on micke.ohlen@gmail.com's account (0d392e5c…) is not deployed to any more.
account_id = "39f8beab0b95e4c3df1242f03744b8f1"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Set via: wrangler secret put FM_USER / FM_PASS
# Plain vars below are non-secret config.

[vars]
FM_HOST = "files.ninetone.com"
FM_DB = "Ninetone Group AB"

# Security audit 2026-09-14.
# CACHE_STATE is the SITE's KV namespace (wrangler.jsonc, same id): the proxy
# only READS its `cache-version` key, to honour `?v=` solely when it equals the
# current Publish epoch. IMAGE_RATE_LIMITER meters cache misses per client IP
# (a miss = one authenticated FM find + one upstream fetch); hits are free.
[[kv_namespaces]]
binding = "CACHE_STATE"
id = "1772c36b9dc24447b58e0625859dc056"

[[ratelimits]]
name = "IMAGE_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 120, period = 60 }
